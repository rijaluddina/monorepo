server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy ──────────────────────────────────────────────────────
    # Forward /api/* requests to the API service without stripping prefix.
    # API sudah punya routes di /api/v1/* (users) dan /api/health bisa
    # ditambahkan nanti jika diperlukan.
    #
    # $request_uri adalah variable → nginx paksa runtime DNS resolution
    # via resolver (127.0.0.11), menghindari "host not found" saat startup.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        proxy_pass http://api:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA routing ────────────────────────────────────────────────────
    # Serve index.html for all non-file routes (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ───────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Static assets caching ──────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
