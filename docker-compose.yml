# ─── Monorepo Production Deployment ─────────────────────────────────────────
#
# Required environment variables (set in .env.production):
#   DATABASE_URL  — PostgreSQL connection string (e.g. postgresql://user:pass@postgres:5432/db)
#   REDIS_URL     — Redis connection string      (e.g. redis://:password@redis:6379)
#   CORS_ORIGIN   — Frontend origin for CORS     (e.g. https://app.example.com)
#
# Optional:
#   PORT              — API port (default: 3000)
#   API_PORT          — Published API port (default: 3000)
#   WEB_PORT          — Published web port (default: 80)
#   POSTGRES_PASSWORD — PostgreSQL password (default: postgres)
#   REDIS_PASSWORD    — Redis password (default: superadmin)
#   OUTBOX_INTERVAL   — Outbox polling interval in ms (default: 5000)
#
# Usage:
#   cp .env.example .env.production   # edit with your values
#   docker compose up --build -d      # start all services
#   docker compose run --rm migration # run DB migrations (one-time)
#
# Migration note:
#   The database migration is a one-time step. Run after first deploy and
#   whenever the schema changes. Uses docker build cache so it's fast.
#     docker compose run --rm --build migration

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: monorepo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-superadmin}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-superadmin}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── API (ElysiaJS) ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.production
    environment:
      # Force production mode regardless of .env values
      NODE_ENV: production
      # Port exposed inside the container (default 3000)
      PORT: ${PORT:-3000}
      # Outbox polling interval
      OUTBOX_INTERVAL: ${OUTBOX_INTERVAL:-5000}
      # ⚠️ Core configs (DATABASE_URL, REDIS_URL, CORS_ORIGIN) berasal dari .env.production
      # JANGAN set di sini — nanti meng-override env_file!
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Web (Vite + React, served via nginx) ────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Empty string → Eden treaty uses relative URLs (/api/v1/...).
        # Nginx proxies /api/* to the API service internally.
        VITE_API_URL: ""
    env_file:
      - .env.production
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Database Migration (one-time) ───────────────────────────────────────
  # Run this service once after deploy to apply schema changes:
  #   docker compose run --rm --build migration
  #
  # Uses the production stage (which has drizzle/ + migrate-dist/ copied)
  # but overrides the entrypoint to run only the migration runner.
  # Uses drizzle-orm's programmatic migrate() — no drizzle-kit dependency.
  migration:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    env_file:
      - .env.production
    # DATABASE_URL, REDIS_URL dll berasal dari .env.production
    # (tidak perlu environment section — sudah di-pass via env_file)
    entrypoint: ["bun", "run", "/app/migrate-dist/migrate-runner.js"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - manual

volumes:
  postgres_data:
  redis_data:
